Friendly\n- Pet Friendly\n- Picnic Area\nThe camp site is about 100 metres from Allports Beach, there are a couple of picnic tables and plenty of space for a few campers. Short term camping is available. You need not make a booking for camping areas it’s first in best dressed.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 29, "kind": "Walks", "name": "Trousers Point", "desc": "One of the Parks & Wildlife Service’s, 60 Great Short Walks of Tasmania, this scenic coastal circuit, begins at the car park at the National Park camping area and includes rocky foreshore and a gravel road. It is reasonably level and takes 1.5 hours. National Park fees and restrictions apply.", "address": "<iframe class=\"alltrails\" src=\"https://www.alltrails.com/widget/trail/australia/tasmania/trousers-point-coastal-track?u=m&sh=neoakq\" width=\"100%\" height=\"400\" frameborder=\"0\" scrolling=\"no\" marginheight=\"0\" marginwidth=\"0\" title=\"AllTrails: Trail Guides and Maps for Hiking, Camping, and Running\"></iframe>", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/G98wBQSGOQiwfVK1GdKw.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming / snorkelling\nKilliecrankie foreshore hosts a free gas BBQ for day use only and the carpark can accommodate about 50 vehicles. Ideal for groups, other facilities include picnic tables, freshwater and a public toilet and shower.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 30, "kind": "Walks", "name": "Strzelecki Peaks", "desc": "This is a strenuous but iconic walk up to the 756m high peak, starting at a signpost 8 kms along Trousers Point Road. It traverses rainforest with orchids and granite massifs with spectacular views. 5 to 7 hours return. As a PWS 'Great Short Walk', National Park fees and restrictions apply.", "address": "<iframe class=\"alltrails\" src=\"https://www.alltrails.com/widget/trail/australia/tasmania/mount-strzelecki-trail?elevationDiagram=false&u=m&sh=neoakq\" width=\"100%\" height=\"400\" frameborder=\"0\" scrolling=\"no\" marginheight=\"0\" marginwidth=\"0\" title=\"AllTrails: Trail Guides and Maps for Hiking, Camping, and Running\"></iframe>", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/P4frcefYArQM9aVTot7F.jfif", "hours": "", "extra": "Facilities: - Lookout\nTo book a spot at this privately owned camping area situated a short distance from the beach, please contact Jude Cazaly 0428 356 238", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 31, "kind": "Walks", "name": "Castle Rock", "desc": "A relatively level walk from Allports Beach via rocky headlands and lovely beaches to the massive granite boulder called\n'Castle Rock'. Best walked on a falling tide. 3 to 4 hours return from Allports Beach Road (car park signposted) or can be walked one-way with a car shuffle to the end of Castle Rock access road. Toilets at Allports Beach picnic area.", "address": "<iframe class=\"alltrails\" src=\"https://www.alltrails.com/widget/trail/australia/tasmania/castle-rock-flinders-island?elevationDiagram=false&u=m&sh=neoakq\" width=\"100%\" height=\"400\" frameborder=\"0\" scrolling=\"no\" marginheight=\"0\" marginwidth=\"0\" title=\"AllTrails: Trail Guides and Maps for Hiking, Camping, and Running\"></iframe>", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/rJR1YaRWez73Jqm94omK.jpg", "hours": "", "extra": "Facilities: - Carpark\n- Family Friendly\n- Pet Friendly\nThis camping spot is just over the dunes from North Beach at 'The River'. The north-facing beach overlooks a bay with a wooded headland at the other end, with views of the outer and inner sisters islands.\n\nThere are toilets about 100 metres away. Short term camping is available and is spacious enough to accommodate groups. Pets/dogs are welcome.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 32, "kind": "Walks", "name": "Wombat Rock", "desc": "From the top car park on The Dock Road - (turn off Palana Road at power pole no.321 6.6km past Killiecrankie Rd and drive 2.2 km), you will see a wombat-shaped rock on the south ridge. It takes 2 to 3 hours return to the top of the eastern peak of Mt Killiecrankie, with continuous views and passing around and through interesting wind-sculpted boulders. Possible through-walk to Killiecrankie via the Diamond Gully track (walk No.7).", "address": "-39.9969544,148.2061067", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/PrHpWIg8jk2pGiRyx3xE.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Wildlife observation\n- Lookout\n- Walks\nThe Patriarch Wildlife Sanctuary is on the east coast of Flinders Island located on Lees Road, Lackrana between Middle and South Patriarch - you can observe wildlife close-up, it is run by a trust and maintained by volunteers. There is a shaded free gas barbecue area making it ideal for a picnic location and toilets, however, bring your own drinking water. The sanctuary is a habitat for abundant wildlife and birdlife including wombats, wallabies and Cape Barren Geese. (donations are appreciated)", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 33, "kind": "Walks", "name": "The Dock - Killiecrankie", "desc": "This walk can be done in either direction and takes between 3 and 4 hours one way. Start from the top car park at the Dock Road, this is a reasonably level walk with some rock-hopping. Visit Stackys Bight and finish at Killiecrankie Beach picnic area\n(managed by Council). This is a great coastal walk with spectacular cliffs, huge wind-shaped boulders and beautiful beaches.", "address": "Yellow Beach Pot Boil Rd, Lady Barron TAS 7255", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/G7zf97eFQlj9Q89jiHEW.jpeg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming\n- Walks\nYellow Beach Lady Barron is day use only. \n\nThere is a shaded free gas BBQ, shelter, picnic tables, water, toilets and a shower at Yellow Beach.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 34, "kind": "Walks", "name": "Diamond Gully Track", "desc": "This track starts across the bay from Killiecrankie between Diamond Gully and Stacky’s Bight and is marked by hand-painted signs. It takes walkers to the top of the eastern peak of Mount Killiecrankie, at 316m. Medium difficulty. It takes between 4 and 5 hours return from Killiecrankie and includes beach walking, a quiet forest, interesting geology and great views. The remarkable Stackys Bight 600m to the west is an optional extension.", "address": "<iframe class=\"alltrails\" src=\"https://www.alltrails.com/widget/trail/australia/tasmania/mount-killiecrankie-via-stacky-s-bight?elevationDiagram=false&u=m&sh=neoakq\" width=\"100%\" height=\"400\" frameborder=\"0\" scrolling=\"no\" marginheight=\"0\" marginwidth=\"0\" title=\"AllTrails: Trail Guides and Maps for Hiking, Camping, and Running\"></iframe>", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/Zd48NBNGnFTvDjg75cD0.JPG", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Camp ground\n- Picnic area\n- Swimming / snorkelling\n- Wildlife observation\n- Walks\nTrousers Point camping ground is located in the Strzelecki National Park. It has a little beach which is great for swimming, picnic tables and short 25m walk away is a toilet block and a shaded free gas BBQ with fresh water (donations appreciated). The car park can accommodate many vehicles and the spot is popular with tour groups. Short-term camping available. Park Entry Fees apply, purchase a Parks Pass $40 before you visit at Service Tasmania or either of the car rental companies.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 35, "kind": "Walks", "name": "Mt Killiecrankie Loop", "desc": "", "address": "<iframe class=\"alltrails\" src=\"https://www.alltrails.com/widget/trail/australia/tasmania/mount-killiecrankie-loop?elevationDiagram=false&u=m&sh=neoakq\" width=\"100%\" height=\"400\" frameborder=\"0\" scrolling=\"no\" marginheight=\"0\" marginwidth=\"0\" title=\"AllTrails: Trail Guides and Maps for Hiking, Camping, and Running\"></iframe>", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/c3BqUf8Fmz2J9ld51Ldu.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming\n- Fishing\n- Exercite Area\n- Walks\nA shaded free gas BBQ, picnic tables are provided just past the Wharf Shed Restaurant before the Exercise equipment, public toilets and shower. The area is for day use only, with gas is kindly supplied by Parks and Wildlife. Freshwater for handwashing is available from a rainwater tank, however, it is advisable to bring your own drinking water.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 36, "kind": "Walks", "name": "Whitemark Showgrounds Dump Ezy Station", "desc": "", "address": "290 Palana Rd, Whitemark TAS 7255", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/6kMOapBkVPOmcRpQ9Yur.jpg", "hours": "", "extra": "Facilities: Open 7 days\nA Dump Ezy station is available for use at Whitemark Showgrounds– Palana Road. Turn left behind main buildings near the toilet amenities block.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 37, "kind": "Walks", "name": "Whitemark Tip", "desc": "", "address": "-40.0734816,148.0414328", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/EPRTD9iqeuVjGKkrX0bA.jpg", "hours": "", "extra": "Facilities:  WHITEMARK TIP OPENING HOURS \n-  Monday        1.30pm - 4.30pm\n-  Tuesday        7am -10am\n-  Wednesday   8.30am - 11.30am\n-  Thursday       7am -10am\n-  Friday           1.30pm - 4.30pm\n-  Saturday        CLOSED\n-  Sunday          1.30pm - 4.30pm\nPlease dispose of your rubbish thoughtfully! Rubbish disposal is available at Whitemark Tip, Lady Barron Transfer Station and Killiecrankie Transfer Station.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 38, "kind": "Walks", "name": "Killiecrankie Transfer Station", "desc": "", "address": "-39.851968, 147.888813", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/LcNzssqDZiZcPfOWZF2T.jpg", "hours": "", "extra": "Facilities: Open 7 days - Skip bins are located at the transfer station on Palana Road just north of the turn-off to the township of Killiecrankie\nPlease dispose of your rubbish thoughtfully! Rubbish disposal is available at Whitemark Tip, Lady Barron Transfer Station and Killiecrankie Transfer Station.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 39, "kind": "Walks", "name": "LadyBarron Transfer Station", "desc": "", "address": "-40.193285, 148.233581", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/Nx95LTPsY99aynvNiUaP.jpg", "hours": "", "extra": "Facilities: Open 7 days - Skip bins are located at the transfer station on Lady Barron Road just outside the town boundary of Lady Barron. \nPlease dispose of your rubbish thoughtfully! Rubbish disposal is available at Whitemark Tip, Lady Barron Transfer Station and Killiecrankie Transfer Station.", "website": "", "source": "WALKING.csv", "status": "Published", "verified": false}, {"id": 40, "kind": "Camping & facilities", "name": "Allports Beach – Emita", "desc": "Camping allowed", "address": "Allports Beach, Emita TAS 7255", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/vz8Hi2hCvPsoAJLcqca7.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Camp ground\n- Picnic area\n- Swimming / snorkelling\n- Walks\nThe camp site is about 100 metres from Allports Beach, there are a couple of picnic tables and plenty of space for a few campers. Short term camping is available. You need not make a booking for camping areas it’s first in best dressed.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 41, "kind": "Camping & facilities", "name": "Killecrankie Bay - Killiecrankie", "desc": "Day use only", "address": "Killiecrankie Bay,\nKilliecrankie Rd, Killiecrankie 7255\nTasmania", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/AaGC4q5zawp5rPQ5ZXel.jpeg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming / snorkelling\n- Walks\n- Fishing\nKilliecrankie foreshore hosts a free gas BBQ for day use only and the carpark can accommodate about 50 vehicles. Ideal for groups, other facilities include picnic tables, freshwater and a public toilet and shower.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 42, "kind": "Camping & facilities", "name": "Killecrankie Private campground", "desc": "Private campground", "address": "Killiecrankie Bay,\nKilliecrankie Rd, Killiecrankie 7255\nTasmania", "phone": "0428 356 238", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/dV8n8ZrZ3250beGeDOAz.jpeg", "hours": "", "extra": "Facilities: \nTo book a spot at this privately owned camping area situated a short distance from the beach, please contact Jude Cazaly 0428 356 238", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 43, "kind": "Camping & facilities", "name": "North East River – Palana", "desc": "Camping allowed", "address": "North East River Road, Palana, Flinders Island, Tasmania, 7255", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/HyI7BEkdha0g0N2VHys3.jpeg", "hours": "", "extra": "Facilities: - Toilets\n- Camp ground\n- Picnic area\n- Wildlife observation\n- Fishing\n- Walks\nThis camping spot is just over the dunes from North Beach at 'The River'. The north-facing beach overlooks a bay with a wooded headland at the other end, with views of the outer and inner sisters islands.\n\nThere are toilets about 100 metres away. Short term camping is available and is spacious enough to accommodate groups. Pets/dogs are welcome.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 44, "kind": "Camping & facilities", "name": "Patriachs Conservation Area – East Coast", "desc": "Day use only", "address": "-39.9969544,148.2061067", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/jQ9C4gDmRdBYo6DsCS7W.jpeg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Wildlife observation\n- Lookout\n- Walks\nThe Patriarch Wildlife Sanctuary is on the east coast of Flinders Island located on Lees Road, Lackrana between Middle and South Patriarch - you can observe wildlife close-up, it is run by a trust and maintained by volunteers. There is a shaded free gas barbecue area making it ideal for a picnic location and toilets, however, bring your own drinking water. The sanctuary is a habitat for abundant wildlife and birdlife including wombats, wallabies and Cape Barren Geese. (donations are appreciated)", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 45, "kind": "Camping & facilities", "name": "Yellow Beach – Lady Barron", "desc": "Day use only", "address": "Yellow Beach Pot Boil Rd, Lady Barron TAS 7255", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/G7zf97eFQlj9Q89jiHEW.jpeg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming\n- Walks\nYellow Beach Lady Barron is day use only. \n\nThere is a shaded free gas BBQ, shelter, picnic tables, water, toilets and a shower at Yellow Beach.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 46, "kind": "Camping & facilities", "name": "Trousers Pt Beach – Strzelecki National Park", "desc": "Camping allowed", "address": "Trousers Point Beach, Trousers Point Rd, Loccota TAS 7255", "phone": "03 6359 2217", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/n2ldO8GWj6KZWFDKM2WA.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Camp ground\n- Picnic area\n- Swimming / snorkelling\n- Wildlife observation\n- Walks\nTrousers Point camping ground is located in the Strzelecki National Park. It has a little beach which is great for swimming, picnic tables and short 25m walk away is a toilet block and a shaded free gas BBQ with fresh water (donations appreciated). The car park can accommodate many vehicles and the spot is popular with tour groups. Short-term camping available. Park Entry Fees apply, purchase a Parks Pass $40 before you visit at Service Tasmania or either of the car rental companies.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 47, "kind": "Camping & facilities", "name": "Whitemark Foreshore", "desc": "Day use only", "address": "17-31 Esplanade, Whitemark TAS 7255", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/c3BqUf8Fmz2J9ld51Ldu.jpg", "hours": "", "extra": "Facilities: - Gas BBQ\n- Toilets\n- Picnic area\n- Swimming\n- Fishing\n- Exercite Area\n- Walks\nA shaded free gas BBQ, picnic tables are provided just past the Wharf Shed Restaurant before the Exercise equipment, public toilets and shower. The area is for day use only, with gas is kindly supplied by Parks and Wildlife. Freshwater for handwashing is available from a rainwater tank, however, it is advisable to bring your own drinking water.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 48, "kind": "Camping & facilities", "name": "Whitemark Showgrounds Dump Ezy Station", "desc": "Open 24/7", "address": "290 Palana Rd, Whitemark TAS 7255", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/6kMOapBkVPOmcRpQ9Yur.jpg", "hours": "", "extra": "Facilities: Open 7 days\nA Dump Ezy station is available for use at Whitemark Showgrounds– Palana Road. Turn left behind main buildings near the toilet amenities block.", "website": "", "source": "CAMPING  FACILITIES.csv", "status": "Published", "verified": false}, {"id": 49, "kind": "Camping & facilities", "name": "Whitemark Tip", "desc": "CLOSED CHRISTMAS DAY, BOXING DAY & NEW YEARS DAY", "address": "-40.0734816,148.0414328", "phone": "03 6359 5001", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/EPRTD9iqeuVjGKkrX0bA.jpg", "hours": "", "extra": "Facilities:  WHITEMARK TIP OPENING HOURS \n-  Monday        1.00pm - 4.00pm\n-  Tuesday        8am -11am\n-  Wednesday   8am - 11am\n-  Thursday       8am -11am\n-  Friday           1.00pm - 4.00pm\n-  Saturday        CLOSE  the most beautiful coastline in Australia. Spectacular mountains with great granite cliffs, rocky ridges, distinctive summits, and forests running down to sandy beaches.", "address": "", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/ST1gMlz7EpB0qiK42YXo.jpg", "hours": "", "extra": "", "website": "", "source": "VISITOR INFO.csv", "status": "Published", "verified": false}, {"id": 96, "kind": "Visitor guides", "name": "Top 10 Fishing Tips on Flinders Island", "desc": "- Catch a calamari squid, flathead or trevally off the Lady Barron wharf\n- The slipway area in Lady Barron might land you a garfish during the cooler months\n- Try your luck spearing a flounder or fishing for flathead or Australian salmon at the North East River – you’re bound to land one! In season you can also dip net for some fresh prawns!\n- Hook yourself a flathead off the Whitemark wharf\n- Many of the western beaches in easterly weather will also produce flathead, visit Marshall Bay, Lillies Beach and Long Point\n- Go on a boat ride and fish in the warm waters of the Continental Shelf with one of the local charter operators\n- Surf Fishing for Gummy Shark at Camerons Inlet could be a winner – especially around the full moon.\n- Salmon Rocks (Eastern end of Trousers Point beach) is a good spot to land a kingfish off the rocks if you’re lucky. Also try fishing for squid off the rocks below the BBQ area\n- Max’s Store at Lady Barron and Killiecrankie Enterprises in Whitemark carry a large supply of fishing tackle \nIf you didn’t have any luck on the day … (which is highly unlikely)\n- ‘Fish of Day’ available at the Furneaux Tavern or on the menu at the Interstate Hotel", "address": "", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/hXJ7kfnxdF6xAgutqqBF.jpg", "hours": "", "extra": "", "website": "", "source": "VISITOR INFO.csv", "status": "Published", "verified": false} ed forests, hidden coves and long empty beaches on short, half or full-day walks. This app highlights popular tracks on the Island; many other walks are possible.\n\nMost walking tracks on Flinders Island are Class 5 or less so care needs to be taken; you are responsible for your own safety. Be aware of your physical ability, dress appropriately, take water and expect the possibility of snakes on all tracks and coastlines. Check the weather and be cautious in windy and wet conditions. Let someone know where you are going or leave a note in your vehicle or accommodation.", "address": "", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/etxPt6Dw8BGKxDS1nB1Z.jpg", "hours": "", "extra": "", "website": "", "source": "WALKING INFO.csv", "status": "Published", "verified": false}, {"id": 113, "kind": "Visitor guides", "name": "Camping guidance", "desc": "RUBBISH \nPlease dispose of your rubbish thoughtfully! \nCampers should dispose of their rubbish ONLY at Council facilities. Pleave the bins at the camping sites free for day users.\n\nRubbish disposal is available at:\n\nTransfer Stations\n Open 24/7 \nSkip bins are located at Transfer Stations on Palana Rd just north of the Killiecrankie turn off and on Lady Barron Rd just outside the town boundary of Lady Barron. \n\nWhitemark Tip - Memana Rd\n\n WHITEMARK TIP OPENING HOURS \n- Monday       1:00pm - 4:00pm\n- Tuesday      8:00am - 11:00am\n- Wednesday  8:00am - 11:00am\n- Thursday     8:00am - 11:00am\n- Friday          1:00pm - 4:00pm\n- Saturday     CLOSED\n- Sunday        1:00pm - 4:00pm\n\nPlease Note: The facility is closed on public holidays. \n\n\n WATER\nWater is potable in Lady Barron and Whitemark only. There is a tap for use at the Whitemark Showgrounds and the BBQ area in Whitemark to replenish your supplies. Rainwater tanks are installed at most of the camping sites, however, the water is untreated.\n\n DUMP EZY \nA Dump Ezy station is available for use at Whitemark Showgrounds– Palana Road. Turn left behind main buildings near the toilet amenities block.\n\n\n CAMPFIRES \nIt is currently a total fire ban on the Furneaux Islands in all campsites and reserves. Fires are NOT permitted in any of these areas. Fines will be issued - no exceptions.\n\n\n BBQ FACILITIES \nFree BBQ facilities are available around the island. Please ensure BBQ facilities are left clean after use.\n - Yellow Beach, Lady Barron\n - Trousers Point\n - Whitemark Foreshore\n - Allports Beach, Emita\n - Killiecrankie\n\n\n FUEL & GAS \nNot available in the north of the Island.\n - Fuel – Whitemark 24/7 & Lady Barron Store 7 days\n - Gas – Lady Barron Store 7 days & Baileys 6359 3513 (Mon-Fri)\n\n\n POWER \nWhen camping on Flinders Island, you need to be self- sufficient. There are NO powered camping sites. If you need to recharge batteries - an option would be to stay in one of the accommodation houses for an evening. Enjoy some creature comforts and recharge.\n\n\n\n BOOKINGS \nThere are no facilities to prebook camping areas. It is a matter of first in best dressed. A National Parks Pass is available from Service Tas or bring yours with you.\n\n\n LAUNDROMAT\nLocated in Lagoon Rd, Whitemark - Building to left of Nutrien Ag Solutions. Walk down left side of building and look for the sign. Takes $1 coins only.\n\n\n SAFETY \nLook up. Avoid camping under trees as it can be dangerous. Branches and trees may fall unpredictably. Take extra care in hot or windy weather or during severe weather events. Observe all warning signs and stay well away from trees that appear to be dead or have dead branches.", "address": "", "phone": "", "image": "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/Mch7GMNogvXNNTDY09RA/pub/HtbTZR6r8QXxsCnL9gPu.png", "hours": "", "extra": "", "website": "", "source": "CAMPING INFO.csv", "status": "Published", "verified": false}, {"id": 114, "kind": "Events", "name": "Community Produce Pop-Up", "desc": "S <script>
(function(){

const stop=new Set(['where','what','when','which','how','can','could','would','should','please','tell','about','near','the','and','for','are','there','with','have','find','get','some','today','open','now','island','furneaux','flinders','me','my','i','do','to','a','an','on','in','at','of','any','available']);
